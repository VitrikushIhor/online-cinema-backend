name: Deploy Nest.JS Application Stage Backend

on:
  push:
    branches: [stage]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Build docker image
        run: docker build -t nyarlathoted/space-cinema-backend:latest .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image to Docker Hub
        run: docker push nyarlathoted/space-cinema-backend:latest

  deploy:
    needs: build
    runs-on: stage
    steps:
      - name: Stop and remove old container
        run: |
          docker stop space-cinema-backend || true
          docker rm space-cinema-backend || true

      - name: Clean up Docker cache
        run: |
          docker system prune -a -f
          docker volume prune -f
          docker builder prune -a -f

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin


      - name: Pull latest Docker image
        run: docker pull nyarlathoted/space-cinema-backend:latest

      - name: Create .env file
        run: |
          echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env
          echo "CLOUDINARY_SECRET_KEY=${{ secrets.CLOUDINARY_SECRET_KEY }}" >> .env



      - name: Deploy new container
        run: |
          docker run -d \
            --name space-cinema-backend\
            --env-file .env \
            -p 8000:8000 \
            nyarlathoted/space-cinema-backend:latest
